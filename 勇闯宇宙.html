<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>勇闯宇宙 · Space Odyssey</title>
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#000;height:100%;
    -webkit-user-select:none;user-select:none;touch-action:none;
    font-family:"Microsoft YaHei","PingFang SC",sans-serif;}
  canvas{display:block;}
  #dashBtn{
    position:fixed;right:22px;bottom:26px;width:78px;height:78px;border-radius:50%;
    border:2px solid rgba(120,220,255,.6);color:#aef;font-size:14px;line-height:1.3;
    display:none;align-items:center;justify-content:center;text-align:center;
    background:rgba(30,60,120,.35);z-index:10;cursor:pointer;
  }
  #dashBtn.ready{box-shadow:0 0 18px rgba(100,220,255,.55);}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="dashBtn">⚡<br>冲刺</div>
<script>
"use strict";
/* ============ 基础 ============ */
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
if(typeof CanvasRenderingContext2D!=="undefined" && !CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h){ this.rect(x,y,w,h); };
}
let W = 0, H = 0;
function resize(){ W = cv.width = innerWidth; H = cv.height = innerHeight; }
resize();   // 注意：此处不能调用 initStars（变量尚未声明，会触发 ReferenceError）

const rnd = (a,b)=>a+Math.random()*(b-a);
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));

/* ============ 音效 ============ */
let AC = null;
function ac(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
function tone(f0,f1,dur,type,vol){
  const a = ac(); if(!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(Math.max(1,f0), a.currentTime);
  o.frequency.exponentialRampToValueAtTime(Math.max(1,f1), a.currentTime+dur);
  g.gain.setValueAtTime(vol, a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime+dur);
  o.connect(g).connect(a.destination);
  o.start(); o.stop(a.currentTime+dur);
}
const sfx = {
  pickup: ()=>tone(660,1320,.12,'sine',.25),
  heart : ()=>tone(520,1040,.15,'triangle',.25),
  hit   : ()=>tone(180,60,.25,'sawtooth',.30),
  shieldHit: ()=>tone(880,220,.2,'square',.18),
  dash  : ()=>tone(300,950,.18,'square',.14),
  boom  : ()=>{ tone(400,40,.7,'sawtooth',.35); tone(120,30,.9,'square',.25); },
  jump  : ()=>{ tone(523,784,.12,'triangle',.25); setTimeout(()=>tone(784,1046,.15,'triangle',.25),110); },
};

/* ============ 星系设定（含专属光效色） ============ */
const SYSTEMS = [
  {name:'太阳系',       at:0,    hue:220, aurora:['#1a4a7a','#2a6a5a']},
  {name:'比邻星域',     at:150,  hue:260, aurora:['#4a2a7a','#7a2a5a']},
  {name:'天狼星区',     at:400,  hue:200, aurora:['#1a5a8a','#3a8aa0']},
  {name:'猎户悬臂',     at:800,  hue:290, aurora:['#6a1a8a','#2a2a9a']},
  {name:'仙女座外缘',   at:1400, hue:180, aurora:['#0a6a6a','#2a8a5a']},
  {name:'银河核心带',   at:2200, hue:30,  aurora:['#8a4a1a','#a03a2a']},
  {name:'暗物质荒原',   at:3500, hue:270, aurora:['#2a0a5a','#5a0a4a']},
  {name:'宇宙之渊',     at:5500, hue:330, aurora:['#6a0a3a','#3a0a6a']},
];
let sysIdx = 0, sysFade = 1;

/* ============ 游戏状态 ============ */
let state = 'menu';
let distance = 0, best = +(localStorage.getItem('spaceBest')||0);
let elapsed = 0, shake = 0;
let astTimer = 0, holeTimer = 0, itemTimer = 0;

const ship = {
  x:0, y:0, vx:0, vy:0, r:16, bank:0,
  hp:3, shield:false, inv:0, dashT:0, dashCd:0, alive:true,
};

let stars = [];      // 3层视差（向下滚动）
let bgStars = [];    // 闪烁远景星
let comets = [];     // 流星
let asteroids = [], holes = [], items = [], parts = [], toasts = [];

/* ============ 初始化 ============ */
function initStars(){
  stars = [];
  for(let L=0;L<3;L++){
    const layer = [];
    const n = Math.floor(W*H/(L===0?9000:L===1?14000:20000));
    for(let i=0;i<n;i++) layer.push({x:rnd(0,W), y:rnd(0,H), s:rnd(.5,L===0?1.2:L===1?1.8:2.6), ph:rnd(0,6.3)});
    stars.push(layer);
  }
  bgStars = [];
  for(let i=0;i<90;i++) bgStars.push({x:rnd(0,W), y:rnd(0,H), s:rnd(.6,2), ph:rnd(0,6.3), sp:rnd(.4,1.6)});
}
function reset(){
  distance = 0; elapsed = 0; sysIdx = 0; sysFade = 1; shake = 0;
  astTimer = .9; holeTimer = 7; itemTimer = 5;
  ship.x = W/2; ship.y = H*.78; ship.vx = ship.vy = 0; ship.bank = 0;
  ship.hp = 3; ship.shield = false; ship.inv = 0; ship.dashT = 0; ship.dashCd = 0; ship.alive = true;
  asteroids = []; holes = []; items = []; parts = []; toasts = []; comets = [];
  toast('向最远的星系，出发！', 2.2);
}
initStars();
addEventListener('resize', ()=>{ resize(); initStars(); });

/* ============ 工具 ============ */
function gameSpeed(){ return 300 + Math.min(620, distance*0.14); }
function circleHit(a,b){ const dx=a.x-b.x, dy=a.y-b.y, r=a.r+b.r; return dx*dx+dy*dy < r*r; }
function toast(text, life){ toasts.push({text, t:0, life:life||2.5}); }
function burst(x,y,color,n,spd){
  for(let i=0;i<n;i++){
    const a = rnd(0,Math.PI*2), v = rnd(spd*.2,spd);
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:0,life:rnd(.4,.9),size:rnd(1.5,4),color});
  }
}

/* ============ 输入 ============ */
const keys = {};
addEventListener('keydown', e=>{
  keys[e.code] = true;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  if(state==='menu'||state==='over'){ if(e.code!=='F5') startGame(); }
  else if(e.code==='Space') doDash();
});
addEventListener('keyup', e=> keys[e.code] = false);

let ptr = {down:false, x:0, y:0};
cv.addEventListener('pointerdown', e=>{
  ac() && AC.resume && AC.resume();
  if(state==='menu'||state==='over'){ startGame(); return; }
  ptr.down = true; ptr.x = e.clientX; ptr.y = e.clientY;
});
cv.addEventListener('pointermove', e=>{ if(ptr.down){ ptr.x = e.clientX; ptr.y = e.clientY; } });
addEventListener('pointerup', ()=> ptr.down = false);

const dashBtn = document.getElementById('dashBtn');
dashBtn.addEventListener('pointerdown', e=>{ e.stopPropagation(); if(state==='play') doDash(); });

function startGame(){ reset(); state = 'play'; dashBtn.style.display = 'flex'; }
function doDash(){
  if(ship.dashCd > 0) return;
  ship.dashT = 1.0; ship.dashCd = 5;
  sfx.dash();
}

/* ============ 生成（全部从屏幕上方落下） ============ */
function spawnAsteroid(){
  const r = rnd(12,34);
  const pts = [];
  const k = 8 + Math.floor(rnd(0,4));
  for(let i=0;i<k;i++) pts.push(rnd(.72,1.15));
  asteroids.push({x: rnd(r+10, W-r-10), y: -r-10, r,
    vx: rnd(-25,25), vy: gameSpeed()*rnd(1.0,1.35),
    rot: rnd(0,6.3), vr: rnd(-2,2), pts, craters: Math.floor(rnd(1,4))});
}
function spawnHole(){
  holes.push({x: rnd(W*.2, W*.8), y: -60,
    r: 18, pull: 250,
    vy: gameSpeed()*0.55, angle: rnd(0,6.3)});
}
function spawnItem(){
  const opts = [];
  if(!ship.shield) opts.push('shield');
  if(ship.hp < 3)  opts.push('heart');
  if(!opts.length) return;
  items.push({x: rnd(30, W-30), y: -20, r:14,
    vy: gameSpeed()*0.8, t:0, type: opts[Math.floor(rnd(0,opts.length))]});
}
function spawnComet(){
  comets.push({x: rnd(0, W), y: -40,
    vx: rnd(-260,-60), vy: rnd(420,620), life:0, max:rnd(1.2,2), len:rnd(80,160), hue:rnd(180,260)});
}

/* ============ 更新 ============ */
function update(dt){
  elapsed += dt;
  distance += gameSpeed()*dt*0.055;
  if(sysFade < 1) sysFade = Math.min(1, sysFade + dt*0.8);

  let ni = 0;
  for(let i=0;i<SYSTEMS.length;i++) if(distance >= SYSTEMS[i].at) ni = i;
  if(ni !== sysIdx){ sysIdx = ni; sysFade = 0; toast('🌌 已进入 · ' + SYSTEMS[sysIdx].name, 2.6); sfx.jump(); }

  // 星空向下滚动（视差）
  const spd = gameSpeed();
  for(let L=0;L<3;L++){
    const f = (L+1)*0.25;
    for(const s of stars[L]){ s.y += spd*dt*f; if(s.y > H+3){ s.y = -3; s.x = rnd(0,W); } }
  }
  for(const s of bgStars){ s.y += spd*dt*0.06; if(s.y>H+3){ s.y=-3; s.x=rnd(0,W); } }
  for(let i=comets.length-1;i>=0;i--){
    const c = comets[i]; c.x += c.vx*dt; c.y += c.vy*dt; c.life += dt;
    if(c.life>c.max || c.y>H+50 || c.x<-200) comets.splice(i,1);
  }
  if(Math.random() < dt*0.12) spawnComet();

  // 操控（主横向，可小幅纵向）
  let ax = 0, ay = 0;
  if(keys['ArrowLeft']||keys['KeyA'])  ax -= 1;
  if(keys['ArrowRight']||keys['KeyD']) ax += 1;
  if(keys['ArrowUp']||keys['KeyW'])    ay -= 1;
  if(keys['ArrowDown']||keys['KeyS'])  ay += 1;
  if(ptr.down){
    const dx = ptr.x - ship.x, dy = ptr.y - ship.y, d = Math.hypot(dx,dy);
    if(d > 12){ ax += dx/d; ay += dy/d; }
  }
  ship.vx += ax*2600*dt; ship.vy += ay*2600*dt;
  ship.vx *= Math.pow(.0025, dt); ship.vy *= Math.pow(.0025, dt);
  if(ship.dashT > 0){ ship.vy -= 1500*dt; ship.dashT -= dt; }   // 冲刺向上推
  ship.x = clamp(ship.x + ship.vx*dt, 20, W-20);
  ship.y = clamp(ship.y + ship.vy*dt, H*.45, H-24);
  ship.bank += (clamp(ship.vx*.0016,-.5,.5) - ship.bank) * Math.min(1, dt*8);
  if(ship.inv > 0) ship.inv -= dt;
  if(ship.dashCd > 0) ship.dashCd -= dt;
  dashBtn.classList.toggle('ready', ship.dashCd <= 0);

  // 引擎尾焰（朝下喷）
  const flameN = ship.dashT>0 ? 3 : 1;
  for(let i=0;i<flameN;i++){
    parts.push({x: ship.x+rnd(-4,4)+ship.bank*10, y: ship.y+20,
      vx: rnd(-30,30)-ship.vx*.2, vy: rnd(220,420)+Math.abs(ship.vy)*.3,
      t:0, life:rnd(.15,.4), size:rnd(2,5),
      color: ship.dashT>0 ? (Math.random()<.5?'#aff':'#8ef') : (Math.random()<.5?'#fa3':'#f73')});
  }

  // 出怪
  astTimer -= dt;
  if(astTimer <= 0){ spawnAsteroid(); astTimer = Math.max(.28, rnd(.9,1.4) - distance*0.00006); }
  holeTimer -= dt;
  if(holeTimer <= 0 && distance > 80){ spawnHole(); holeTimer = rnd(9,15); }
  itemTimer -= dt;
  if(itemTimer <= 0){ spawnItem(); itemTimer = rnd(8,14); }

  // 陨石
  for(let i=asteroids.length-1;i>=0;i--){
    const a = asteroids[i];
    a.x += a.vx*dt; a.y += a.vy*dt; a.rot += a.vr*dt;
    if(a.y > H+60){ asteroids.splice(i,1); continue; }
    if(ship.alive && circleHit(a, ship)){
      if(ship.dashT > 0 || ship.inv > 0) continue;
      if(ship.shield){
        ship.shield = false; ship.inv = .8;
        burst(a.x, a.y, '#6df', 26, 300); burst(ship.x, ship.y, '#0ff', 10, 200);
        asteroids.splice(i,1); sfx.shieldHit(); shake = 6;
      }else{
        hitShip(); burst(a.x, a.y, '#c96', 22, 280); asteroids.splice(i,1);
      }
    }
  }

  // 黑洞：引力 + 吞噬
  for(let i=holes.length-1;i>=0;i--){
    const h = holes[i];
    h.x += 0; h.y += h.vy*dt; h.angle += dt;
    if(h.y > H+80){ holes.splice(i,1); continue; }
    const dx = h.x - ship.x, dy = h.y - ship.y, d = Math.hypot(dx,dy);
    if(d < h.pull && ship.alive){
      const f = 48000 / Math.max(d*d, 600);
      ship.vx += dx/d * f * 60 * dt; ship.vy += dy/d * f * 60 * dt;
      if(d < h.pull*.6 && Math.random()<.5)
        parts.push({x:ship.x, y:ship.y, vx:-dx*1.2, vy:-dy*1.2, t:0, life:.4, size:2, color:'#b7f'});
      if(d < h.pull && Math.random()<.7){
        const an = Math.atan2(dy,dx)+Math.PI/2;
        parts.push({x:h.x+Math.cos(an)*h.r*2, y:h.y+Math.sin(an)*h.r*2,
          vx:Math.cos(an)*80, vy:Math.sin(an)*80, t:0, life:.5, size:2, color:`hsl(${SYSTEMS[sysIdx].hue+60},90%,70%)`});
      }
    }
    if(ship.alive && d < h.r + ship.r){
      if(ship.dashT > 0 || ship.inv > 0){
        burst(h.x, h.y, '#fff', 40, 500); holes.splice(i,1); sfx.shieldHit();
      }else if(ship.shield){
        ship.shield = false; ship.inv = 1.2;
        burst(h.x, h.y, '#6df', 40, 520); holes.splice(i,1); sfx.shieldHit(); shake = 14;
      }else{
        destroyShip('被黑洞吞噬了');
      }
    }
  }

  // 道具
  for(let i=items.length-1;i>=0;i--){
    const it = items[i];
    it.y += it.vy*dt; it.t += dt;
    if(it.y > H+30){ items.splice(i,1); continue; }
    if(circleHit(it, ship)){
      if(it.type==='shield'){ ship.shield = true; sfx.pickup(); toast('🛡 护盾已装备', 1.6); }
      else { ship.hp = Math.min(3, ship.hp+1); sfx.heart(); toast('❤ 修复 +1', 1.6); }
      burst(it.x, it.y, it.type==='shield'?'#0ff':'#f66', 14, 200);
      items.splice(i,1);
    }
  }

  // 粒子 / 提示
  for(let i=parts.length-1;i>=0;i--){
    const p = parts[i];
    p.t += dt; p.x += p.vx*dt; p.y += p.vy*dt; p.vx*=.98; p.vy*=.98;
    if(p.t > p.life) parts.splice(i,1);
  }
  for(let i=toasts.length-1;i>=0;i--){
    const t = toasts[i]; t.t += dt;
    if(t.t > t.life) toasts.splice(i,1);
  }
  if(shake > 0) shake -= dt*30;
}

function hitShip(){
  ship.hp--; ship.inv = 1.5; shake = 10; sfx.hit();
  burst(ship.x, ship.y, '#f84', 20, 260);
  if(ship.hp <= 0) destroyShip('飞船被击毁了');
}
function destroyShip(msg){
  if(!ship.alive) return;
  ship.alive = false;
  toast('💥 ' + msg, 3);
  burst(ship.x, ship.y, '#fc6', 60, 450); burst(ship.x, ship.y, '#f44', 40, 320);
  sfx.boom(); shake = 18;
  setTimeout(()=>{
    state = 'over';
    dashBtn.style.display = 'none';
    if(distance > best){ best = distance; localStorage.setItem('spaceBest', Math.floor(best)); }
  }, 900);
}

/* ============ 背景绘制 ============ */
function drawBackground(){
  const S = SYSTEMS[sysIdx], hue = S.hue;
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0, `hsl(${hue},50%,10%)`);
  g.addColorStop(.55, `hsl(${(hue+30)%360},55%,6%)`);
  g.addColorStop(1, `hsl(${(hue+60)%360},60%,3%)`);
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

  ctx.globalCompositeOperation = 'lighter';

  // 星云光斑（向下漂移 + 呼吸）
  for(let L=0;L<3;L++){
    const py = ((H*1.4 + (elapsed*gameSpeed()*.05*(L+1)) % (H*1.8)) + H*2) % (H*1.8+H*.4) - H*.4;
    const px = W*(.2+.3*L) + Math.sin(elapsed*.3+L*2)*40;
    const R = 260+L*90 + Math.sin(elapsed*.5+L)*30;
    const rg = ctx.createRadialGradient(px,py,0,px,py,R);
    rg.addColorStop(0, `hsla(${(hue+L*70)%360},85%,55%,${.10+.03*Math.sin(elapsed*.8+L*3)})`);
    rg.addColorStop(.5, `hsla(${(hue+L*70+30)%360},80%,45%,.05)`);
    rg.addColorStop(1, 'transparent');
    ctx.fillStyle = rg; ctx.fillRect(px-R,py-R,R*2,R*2);
  }

  // 极光带（横向波浪，缓慢流动）
  ctx.globalAlpha = .12;
  for(let b=0;b<2;b++){
    const yBase = H*(.2+b*.3) + Math.sin(elapsed*.4+b*3)*40;
    ctx.fillStyle = S.aurora[b];
    ctx.beginPath(); ctx.moveTo(0, yBase);
    for(let x=0;x<=W;x+=60){
      const yy = yBase + Math.sin(x*.004 + elapsed*.7 + b*2)*45 + Math.sin(x*.011 - elapsed*.45)*22;
      ctx.lineTo(x, yy);
    }
    ctx.lineTo(W, yBase+140); ctx.lineTo(0, yBase+140); ctx.closePath(); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // 远景闪烁星
  for(const s of bgStars){
    const a = .3+.7*Math.abs(Math.sin(elapsed*s.sp+s.ph));
    ctx.fillStyle = `hsla(${(hue+180)%360},40%,92%,${a*.5})`;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.s, 0, 7); ctx.fill();
  }
  // 三层视差星
  for(let L=0;L<3;L++){
    for(const s of stars[L]){
      const tw = .55+.45*Math.sin(elapsed*(1.5+L*.6)+s.ph);
      ctx.fillStyle = `hsla(${(hue+L*40)%360},70%,88%,${(.25+L*.2)*tw})`;
      ctx.fillRect(s.x, s.y, s.s, s.s);
    }
  }
  ctx.globalCompositeOperation = 'source-over';
}
function drawComets(){
  ctx.globalCompositeOperation = 'lighter';
  for(const c of comets){
    const k = 1 - c.life/c.max;
    const v = Math.hypot(c.vx,c.vy)||1;
    const tx = c.x - c.vx/v*c.len, ty = c.y - c.vy/v*c.len;
    const grad = ctx.createLinearGradient(c.x, c.y, tx, ty);
    grad.addColorStop(0, `hsla(${c.hue},100%,85%,${.9*k})`);
    grad.addColorStop(1, 'transparent');
    ctx.strokeStyle = grad; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.moveTo(c.x, c.y); ctx.lineTo(tx, ty); ctx.stroke();
    ctx.fillStyle = `hsla(${c.hue},100%,90%,${k})`;
    ctx.beginPath(); ctx.arc(c.x, c.y, 2.6, 0, 7); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}
function drawVignette(){
  const rg = ctx.createRadialGradient(W/2,H/2, Math.min(W,H)*.45, W/2,H/2, Math.max(W,H)*.78);
  rg.addColorStop(0,'transparent');
  rg.addColorStop(1,'rgba(0,0,10,.45)');
  ctx.fillStyle = rg; ctx.fillRect(0,0,W,H);
}

/* ============ 飞船绘制（机头朝上） ============ */
function drawShip(){
  const dash = ship.dashT > 0;
  ctx.save();
  ctx.translate(ship.x, ship.y);
  ctx.rotate(-Math.PI/2 + ship.bank);   // 基础朝向：向上；bank：左右倾斜
  ctx.scale(1.35, 1.35);

  /* 尾焰（local -x → 世界下方） */
  const fl = dash ? 46 : 26;
  const flGlow = ctx.createLinearGradient(-14,0,-14-fl,0);
  if(dash){
    flGlow.addColorStop(0,'rgba(150,255,255,.95)');
    flGlow.addColorStop(.4,'rgba(80,180,255,.55)');
    flGlow.addColorStop(1,'transparent');
  }else{
    flGlow.addColorStop(0,'rgba(255,220,120,.9)');
    flGlow.addColorStop(.5,'rgba(255,120,40,.5)');
    flGlow.addColorStop(1,'transparent');
  }
  ctx.fillStyle = flGlow;
  ctx.beginPath();
  ctx.moveTo(-13,-6); ctx.lineTo(-14-fl-Math.random()*8,-1); ctx.lineTo(-13,6);
  ctx.closePath(); ctx.fill();

  /* 主翼 */
  ctx.fillStyle = '#31435f'; ctx.strokeStyle = '#17222f'; ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(-2,-4); ctx.lineTo(-16,-16); ctx.lineTo(-22,-14); ctx.lineTo(-12,-3);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-2,4); ctx.lineTo(-16,16); ctx.lineTo(-22,14); ctx.lineTo(-12,3);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  // 翼尖航灯（闪烁）
  const lamp = Math.sin(elapsed*7)>0 ? '#ff5566' : '#5aff88';
  ctx.fillStyle = lamp; ctx.shadowColor = lamp; ctx.shadowBlur = 8;
  ctx.beginPath(); ctx.arc(-22,-14,1.8,0,7); ctx.fill();
  ctx.beginPath(); ctx.arc(-22,14,1.8,0,7); ctx.fill();
  ctx.shadowBlur = 0;

  /* 机身 */
  const body = ctx.createLinearGradient(0,-10,0,10);
  body.addColorStop(0,'#f2f6fb'); body.addColorStop(.35,'#c9d6e6');
  body.addColorStop(.55,'#8fa3bd'); body.addColorStop(1,'#4a5c78');
  ctx.fillStyle = body; ctx.strokeStyle = '#233346'; ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(24,0);
  ctx.quadraticCurveTo(16,-6, 6,-8);
  ctx.lineTo(-12,-7); ctx.quadraticCurveTo(-18,-4,-18,0);
  ctx.quadraticCurveTo(-18,4, -12,7);
  ctx.lineTo(6,8); ctx.quadraticCurveTo(16,6, 24,0);
  ctx.closePath(); ctx.fill(); ctx.stroke();

  /* 机腹红色饰条 */
  ctx.fillStyle = '#d0453f';
  ctx.beginPath();
  ctx.moveTo(20,0); ctx.quadraticCurveTo(12,2.6,4,3.4); ctx.lineTo(4,1.8);
  ctx.quadraticCurveTo(12,1.2, 20,0); ctx.closePath(); ctx.fill();

  /* 座舱罩 */
  const glass = ctx.createLinearGradient(4,-8,14,6);
  glass.addColorStop(0,'rgba(160,240,255,.95)');
  glass.addColorStop(.5,'rgba(40,140,220,.85)');
  glass.addColorStop(1,'rgba(15,60,110,.9)');
  ctx.fillStyle = glass; ctx.strokeStyle = '#1b2a3a'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.ellipse(9,-1.5,7.5,4.4,-.12,0,7); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.arc(8,-3,4.4,Math.PI*1.15,Math.PI*1.65); ctx.stroke();

  /* 垂尾 */
  ctx.fillStyle = '#3d5473'; ctx.strokeStyle = '#1c2938'; ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(-8,-6); ctx.lineTo(-14,-14); ctx.lineTo(-17,-13); ctx.lineTo(-13,-5);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#e8b93a';
  ctx.beginPath(); ctx.arc(-14.5,-12,1.6,0,7); ctx.fill();

  /* 双引擎喷口 */
  ctx.fillStyle = dash ? '#aef' : '#5a6d88';
  ctx.strokeStyle = '#17222f';
  ctx.beginPath(); ctx.roundRect(-21,-7.5,7,4.5,1.5); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.roundRect(-21,3,7,4.5,1.5); ctx.fill(); ctx.stroke();
  ctx.fillStyle = dash ? 'rgba(140,255,255,.95)' : 'rgba(255,170,70,.9)';
  ctx.shadowColor = dash ? '#8ff' : '#f83'; ctx.shadowBlur = 10;
  ctx.beginPath(); ctx.arc(-21.5,-5.2,1.9,0,7); ctx.fill();
  ctx.beginPath(); ctx.arc(-21.5,5.2,1.9,0,7); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.restore();

  /* 护盾气泡 */
  if(ship.shield){
    ctx.save(); ctx.translate(ship.x, ship.y);
    const R = 34;
    const pulse = .5+Math.sin(elapsed*6)*.18;
    const rg = ctx.createRadialGradient(0,0,R*.55, 0,0,R);
    rg.addColorStop(0,'rgba(0,255,255,0)');
    rg.addColorStop(.75,`rgba(0,200,255,${pulse*.12})`);
    rg.addColorStop(1, `rgba(120,240,255,${pulse})`);
    ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(0,0,R,0,7); ctx.fill();
    ctx.strokeStyle = `rgba(140,255,255,${pulse})`; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0,0,R,0,7); ctx.stroke();
    ctx.restore();
  }
}

/* ============ 主绘制 ============ */
function draw(){
  drawBackground();

  ctx.save();
  if(shake > 0) ctx.translate(rnd(-shake,shake)*.5, rnd(-shake,shake)*.5);

  drawComets();

  if(sysFade < .35){
    ctx.fillStyle = `rgba(255,255,255,${(.35-sysFade)/.35*.5})`;
    ctx.fillRect(-30,-30,W+60,H+60);
  }

  // 黑洞
  for(const h of holes){
    const rg = ctx.createRadialGradient(h.x,h.y,h.r*.4, h.x,h.y,h.pull);
    rg.addColorStop(0,'rgba(0,0,0,.95)');
    rg.addColorStop(.18,'rgba(20,0,40,.75)');
    rg.addColorStop(1,'transparent');
    ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(h.x,h.y,h.pull,0,7); ctx.fill();
    ctx.save(); ctx.translate(h.x,h.y); ctx.rotate(h.angle);
    ctx.shadowColor = `hsl(${(SYSTEMS[sysIdx].hue+80)%360},90%,60%)`; ctx.shadowBlur = 18;
    ctx.strokeStyle = `hsla(${(SYSTEMS[sysIdx].hue+80)%360},90%,65%,.85)`; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(h.x*0,h.y*0,h.r*2.1,h.r*.7,0,0,7); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,200,120,.5)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(0,0,h.r*2.6,h.r*.9,.5,0,7); ctx.stroke();
    ctx.restore();
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(h.x,h.y,h.r,0,7); ctx.fill();
  }

  // 道具
  for(const it of items){
    ctx.save(); ctx.translate(it.x, it.y + Math.sin(it.t*4)*4);
    ctx.shadowBlur = 16;
    if(it.type==='shield'){
      ctx.shadowColor = ctx.strokeStyle = '#0ff';
      ctx.lineWidth = 2.5; ctx.fillStyle = 'rgba(0,255,255,.15)';
      ctx.beginPath(); ctx.moveTo(0,-12); ctx.lineTo(10,-6); ctx.lineTo(10,5);
      ctx.lineTo(0,13); ctx.lineTo(-10,5); ctx.lineTo(-10,-6); ctx.closePath();
      ctx.fill(); ctx.stroke();
    }else{
      ctx.shadowColor = '#f44'; ctx.fillStyle = '#f55';
      ctx.font = '22px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('❤', 0, 1);
    }
    ctx.restore();
  }

  // 陨石
  for(const a of asteroids){
    ctx.save(); ctx.translate(a.x,a.y); ctx.rotate(a.rot);
    ctx.fillStyle = `hsl(${(SYSTEMS[sysIdx].hue+30)%360},16%,30%)`;
    ctx.strokeStyle = `hsl(${SYSTEMS[sysIdx].hue},60%,62%)`; ctx.lineWidth = 1.4;
    ctx.shadowColor = `hsl(${SYSTEMS[sysIdx].hue},80%,55%)`; ctx.shadowBlur = 7;
    ctx.beginPath();
    const k = a.pts.length;
    for(let i=0;i<k;i++){
      const an = i/k*Math.PI*2, r = a.r*a.pts[i];
      i ? ctx.lineTo(Math.cos(an)*r, Math.sin(an)*r) : ctx.moveTo(Math.cos(an)*r, Math.sin(an)*r);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.shadowBlur = 0;
    for(let c=0;c<a.craters;c++){
      const an = c*2.4 + a.pts[0]*5, rr = a.r*(.25+.3*(c%2));
      ctx.fillStyle = 'rgba(0,0,0,.28)';
      ctx.beginPath(); ctx.arc(Math.cos(an)*rr, Math.sin(an)*rr, a.r*.16, 0, 7); ctx.fill();
    }
    ctx.restore();
  }

  // 飞船（受击闪烁）
  if(ship.alive && !(ship.inv > 0 && Math.floor(elapsed*12)%2)) drawShip();

  // 粒子
  ctx.globalCompositeOperation = 'lighter';
  for(const p of parts){
    ctx.globalAlpha = Math.max(0, 1 - p.t/p.life);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x-p.size/2, p.y-p.size/2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.restore();

  drawVignette();
  drawHUD();
  for(const t of toasts){
    const a = t.t<.3 ? t.t/.3 : (t.life-t.t<.5 ? (t.life-t.t)/.5 : 1);
    ctx.globalAlpha = clamp(a,0,1);
    ctx.font = 'bold 28px "Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
    ctx.shadowColor = '#0af'; ctx.shadowBlur = 16;
    ctx.fillText(t.text, W/2, H*.3);
    ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  }
  if(state==='menu') drawMenu();
  if(state==='over') drawOver();
}

function drawHUD(){
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.font = '22px sans-serif';
  for(let i=0;i<3;i++){
    ctx.fillStyle = i < ship.hp ? '#f55' : 'rgba(255,255,255,.18)';
    ctx.fillText('❤', 16+i*28, 14);
  }
  if(ship.shield){ ctx.fillStyle='#0ff'; ctx.fillText('🛡', 16+3*28+6, 14); }
  const cd = clamp(1 - ship.dashCd/5, 0, 1);
  ctx.fillStyle = 'rgba(255,255,255,.15)'; ctx.fillRect(16, 46, 110, 8);
  ctx.fillStyle = cd>=1 ? '#6ff' : '#5a8'; ctx.fillRect(16, 46, 110*cd, 8);
  ctx.font = '11px sans-serif'; ctx.fillStyle = '#9cf';
  ctx.fillText('冲刺 '+(cd>=1?'READY':Math.ceil(ship.dashCd)+'s'), 16, 58);
  ctx.textAlign = 'right'; ctx.font = 'bold 22px "Microsoft YaHei",sans-serif';
  ctx.fillStyle = '#fff'; ctx.shadowColor='#08f'; ctx.shadowBlur=8;
  ctx.fillText(Math.floor(distance) + ' 光年', W-16, 14);
  ctx.shadowBlur=0;
  ctx.font = '14px sans-serif'; ctx.fillStyle = `hsl(${SYSTEMS[sysIdx].hue},80%,70%)`;
  ctx.fillText(SYSTEMS[sysIdx].name + '　·　纪录 ' + Math.floor(best) + ' 光年', W-16, 42);
}

function drawMenu(){
  ctx.fillStyle = 'rgba(0,0,20,.6)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign = 'center';
  ctx.font = 'bold 54px "Microsoft YaHei",sans-serif';
  ctx.fillStyle = '#fff'; ctx.shadowColor = '#0af'; ctx.shadowBlur = 30;
  ctx.fillText('🚀 勇闯宇宙', W/2, H*.26);
  ctx.shadowBlur = 0;
  ctx.font = '18px sans-serif'; ctx.fillStyle = '#9cf';
  ctx.fillText('向上飞行！躲避从天而降的陨石，挣脱黑洞引力！', W/2, H*.36);
  ctx.fillStyle = '#ddd';
  ctx.fillText('电脑：← →（或 WASD）移动　·　空格 冲刺', W/2, H*.46);
  ctx.fillText('手机：手指拖动控制飞船　·　右下按钮冲刺', W/2, H*.51);
  const pulse = .6+Math.sin(elapsed*4)*.4;
  ctx.fillStyle = `rgba(120,230,255,${pulse})`;
  ctx.font = 'bold 24px sans-serif';
  ctx.fillText('— 点击屏幕 或 按任意键 出发 —', W/2, H*.64);
}

function drawOver(){
  ctx.fillStyle = 'rgba(0,0,20,.65)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign = 'center';
  ctx.font = 'bold 44px "Microsoft YaHei",sans-serif';
  ctx.fillStyle = '#f66'; ctx.shadowColor = '#f00'; ctx.shadowBlur = 20;
  ctx.fillText('任务失败', W/2, H*.3);
  ctx.shadowBlur = 0;
  ctx.font = 'bold 28px sans-serif'; ctx.fillStyle = '#fff';
  ctx.fillText(`本次航程：${Math.floor(distance)} 光年 · ${SYSTEMS[sysIdx].name}`, W/2, H*.42);
  ctx.font = '22px sans-serif'; ctx.fillStyle = '#fc6';
  ctx.fillText(distance >= best ? '🏆 新纪录！你飞到了最远的星！' : `历史最远：${Math.floor(best)} 光年`, W/2, H*.5);
  const pulse = .6+Math.sin(elapsed*4)*.4;
  ctx.fillStyle = `rgba(120,230,255,${pulse})`;
  ctx.font = 'bold 22px sans-serif';
  ctx.fillText('— 点击屏幕 再次出击 —', W/2, H*.63);
}

/* ============ 主循环 ============ */
let last = performance.now();
function loop(now){
  const dt = Math.min(.033, (now-last)/1000);
  last = now;
  if(state==='play' && ship.alive) update(dt);
  else {
    elapsed += dt;
    if(sysFade < 1) sysFade = Math.min(1, sysFade + dt*0.8);
    for(let L=0;L<3;L++) for(const s of stars[L]){ s.y += (L+1)*20*dt; if(s.y>H+3){s.y=-3;s.x=rnd(0,W);} }
    for(const s of bgStars){ s.y += 6*dt; if(s.y>H+3){s.y=-3;s.x=rnd(0,W);} }
    if(Math.random() < dt*0.15) spawnComet();
    for(let i=comets.length-1;i>=0;i--){
      const c = comets[i]; c.x += c.vx*dt*.5; c.y += c.vy*dt*.5; c.life += dt;
      if(c.life>c.max || c.y>H+50) comets.splice(i,1);
    }
  }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
